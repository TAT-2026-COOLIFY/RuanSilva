
name: CI/CD - Controle Financeiro no Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-backend:
    name: CI - Build do Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ControlFinacer

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar backend
        run: mvn -B package -DskipTests

  build-frontend:
    name: CI - Build do Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend-ControlFinacer/frontendTCC

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build

  deploy:
    name: CD - Deploy no Coolify
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Deploy Backend
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_BACKEND }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "$WEBHOOK" \
            -H "Authorization: Bearer $TOKEN"

      - name: Deploy Frontend
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_FRONTEND }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "$WEBHOOK" \
            -H "Authorization: Bearer $TOKEN"
